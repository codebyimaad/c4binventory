name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ Copy files to server (excluding .git and GitHub folder)
    - name: Copy project to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        source: "./*"
        target: "/home/deploy/c4binventory"
        strip_components: 1        # avoid nesting files inside extra folders
        rm: true                   # remove old files before upload (optional, but useful)

    # ✅ SSH into server and restart docker
    - name: SSH and rebuild/start Docker
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          cd /home/deploy/c4binventory
          docker-compose down
          docker-compose up -d --build
